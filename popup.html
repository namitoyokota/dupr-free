<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>DUPR Free</title>
    <link rel="stylesheet" href="popup.css" />
    <script src="popup.js" defer></script>
  </head>
  <body>
    <header class="topbar">
      <a class="brand" href="#" aria-label="DUPR Free">
        <img src="assets/logo.svg" width="146" height="36" alt="DUPR Free" />
      </a>
      <span class="topbar-note">PLAYER LOOKUP</span>
    </header>

    <main>
      <div class="state" id="state" aria-live="polite">
        <span class="spinner" aria-hidden="true"></span>
        <span id="state-message">Checking this page…</span>
      </div>

      <section id="profile" hidden aria-label="DUPR player profile">
        <article class="card player-card">
          <div class="avatar-wrap">
            <img class="avatar" id="profile-image" alt="" hidden />
            <span class="avatar-fallback" id="avatar-fallback" aria-hidden="true">?</span>
          </div>
          <div class="player-copy">
            <h1 id="profile-name"></h1>
            <div class="meta" id="profile-meta"></div>
            <div class="meta profile-details" id="dupr-id-meta"></div>
          </div>
        </article>

        <article
          class="card primary-rating"
          id="primary-rating-card"
          aria-label="Doubles DUPR rating"
        >
          <div class="rating-heading">
            <p class="eyebrow" id="primary-title">Doubles</p>
            <span class="badge" id="rating-status" hidden>Provisional</span>
          </div>
          <div class="rating-value-row">
            <p class="rating-value" id="primary-value">—</p>
            <div
              class="reliability"
              id="primary-reliability"
              aria-label="Reliability unavailable"
            >
              <span class="reliability-ring">
                <span id="primary-reliability-value">—</span>
              </span>
              <span class="reliability-label">RELIABILITY</span>
            </div>
          </div>
        </article>

        <article
          class="card primary-rating"
          id="secondary-rating-card"
          aria-label="Secondary DUPR rating"
        >
          <div class="rating-heading">
            <p class="eyebrow" id="secondary-title">Singles</p>
            <span class="badge" id="secondary-status" hidden>Provisional</span>
          </div>
          <div class="rating-value-row">
            <p class="rating-value" id="secondary-value">—</p>
            <div
              class="reliability"
              id="secondary-reliability"
              aria-label="Reliability unavailable"
            >
              <span class="reliability-ring">
                <span id="secondary-reliability-value">—</span>
              </span>
              <span class="reliability-label">RELIABILITY</span>
            </div>
          </div>
        </article>
      </section>
    </main>
  </body>
</html>
